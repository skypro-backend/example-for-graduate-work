app:
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:${DB_PORT:5432}}/${PG_DB:market_db}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:secret_password}
    driver-class-name: org.postgresql.Driver

spring:
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true