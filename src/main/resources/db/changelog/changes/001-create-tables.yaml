databaseChangeLog:

  - changeSet:
      id: 001-create-users
      author: graduate
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(50)

              - column:
                  name: last_name
                  type: VARCHAR(50)

              - column:
                  name: phone
                  type: VARCHAR(30)

              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: image
                  type: VARCHAR(255)

  - changeSet:
      id: 002-create-ads
      author: graduate
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: image
                  type: VARCHAR(255)

              - column:
                  name: author_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ads_author
                    references: users(id)

  - changeSet:
      id: 003-create-comments
      author: graduate
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: text
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: author_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_author
                    references: users(id)

              - column:
                  name: ad_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ad
                    references: ads(id)