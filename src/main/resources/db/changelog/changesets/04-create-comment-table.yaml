databaseChangeLog:
  - changeSet:
      id: 4
      author: boris
      changes:
        - createTable:
            tableName: comment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comment_profile
                    referencedTableName: user_profile
                    referencedColumnNames: id
                    deleteCascade: true


              - column:
                  name: ad_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comment_ad
                    referencedTableName: ad
                    referencedColumnNames: id
                    deleteCascade: true