databaseChangeLog:
  - changeSet:
      id: 1
      author: boris
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: avatar_s3_key
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)