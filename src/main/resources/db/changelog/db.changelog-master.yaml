databaseChangeLog:
  - changeSet:
      id: 1
      author: AntonSopetov
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: phone
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(50)
              - column:
                  name: image
                  type: varchar(255)

  - changeSet:
      id: 2
      author: AntonSopetov
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ads_users
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: image
                  type: varchar(255)

  - changeSet:
      id: 3
      author: AntonSopetov
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_users
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: ad_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ads
                    referencedTableName: ads
                    referencedColumnNames: id
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false

  - changeSet:
      id: 4
      author: AntonSopetov
      changes:
        - createTable:
            tableName: users_security
            columns:
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
        - createTable:
            tableName: authorities
            columns:
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: authority
                  type: varchar(50)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: authorities
            baseColumnNames: username
            constraintName: fk_authorities_users
            referencedTableName: users_security
            referencedColumnNames: username