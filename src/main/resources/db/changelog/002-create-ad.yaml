databaseChangeLog:
  - changeSet:
      id: 2
      author: marina
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(100)
              - column:
                  name: price
                  type: INT
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: image
                  type: TEXT
              - column:
                  name: author_id
                  type: INT
        - addForeignKeyConstraint:
            constraintName: fk_ads_users_author
            baseTableName: ads
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: id