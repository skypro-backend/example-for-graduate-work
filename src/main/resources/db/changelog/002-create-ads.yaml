databaseChangeLog:

  - changeSet:
      id: create-ads-table
      author: katya

      changes:

        - createTable:
            tableName: ads

            columns:

              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)

              - column:
                  name: price
                  type: INTEGER

              - column:
                  name: description
                  type: VARCHAR(1000)

              - column:
                  name: image
                  type: VARCHAR(1000)

              - column:
                  name: author_id
                  type: INTEGER
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:

            baseTableName: ads
            baseColumnNames: author_id

            referencedTableName: users
            referencedColumnNames: id

            constraintName: fk_ads_users