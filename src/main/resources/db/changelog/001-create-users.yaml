databaseChangeLog:

  - changeSet:
      id: create-users-table
      author: katya

      changes:

        - createTable:
            tableName: users

            columns:

              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)

              - column:
                  name: last_name
                  type: VARCHAR(255)

              - column:
                  name: phone
                  type: VARCHAR(255)

              - column:
                  name: role
                  type: VARCHAR(20)

              - column:
                  name: image
                  type: VARCHAR(1000)