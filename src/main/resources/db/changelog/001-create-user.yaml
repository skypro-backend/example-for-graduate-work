databaseChangeLog:
  - changeSet:
      id: 1
      author: marina
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(50)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: first_name
                  type: VARCHAR(50)
              - column:
                  name: last_name
                  type: VARCHAR(50)
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: role
                  type: VARCHAR(20)
              - column:
                  name: image
                  type: TEXT