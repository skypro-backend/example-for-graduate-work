databaseChangeLog:
  - changeSet:
      id: 003-create-comments-table
      author: skypro
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: text
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_author
                    references: users(id)
              - column:
                  name: ad_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ad
                    references: ads(id)